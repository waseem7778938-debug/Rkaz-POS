<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">نظام ركاز الشامل - نقاط البيع والمحاسبة</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0a1428 0%, #172a49 50%, #0f172a 100%);
            --glass-bg: rgba(255, 255, 255, 0.04);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-color: #ffffff;
            --accent-color: #38bdf8;
            --btn-green: #10b981;
            --btn-green-hover: #059669;
        }

        body {
            font-family: Tahoma, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 30px;
            border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5), inset 0 0 15px rgba(56, 189, 248, 0.1);
            border: 1px solid var(--glass-border);
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 15px;
        }

        h2, h3 {
            color: var(--text-color);
            margin: 0;
        }

        /* قسم الهوية والبراند المركزي الفاخر */
        .brand-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, rgba(23, 42, 73, 0.9), rgba(10, 20, 40, 0.95));
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 30px;
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            text-align: center;
        }

        .brand-logo-img {
            width: 90px;
            height: 90px;
            object-fit: contain;
            margin-bottom: 10px;
            filter: drop-shadow(0 5px 15px rgba(56, 189, 248, 0.4));
        }

        .brand-title {
            font-size: 24px;
            font-weight: bold;
            color: #fff;
            letter-spacing: 1px;
        }

        .brand-subtitle {
            font-size: 14px;
            color: var(--accent-color);
            margin-top: 5px;
        }

        .section {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 25px;
        }

        input, select {
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid var(--glass-border);
            color: #fff;
            padding: 12px;
            margin: 8px 0;
            font-size: 16px;
            width: 100%;
            box-sizing: border-box;
            border-radius: 8px;
            outline: none;
            transition: all 0.3s ease;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.3);
        }

        select option {
            background: #0f172a;
            color: #fff;
        }

        button {
            background: var(--btn-green);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
            transition: background 0.3s;
        }

        button:hover {
            background: var(--btn-green-hover);
        }

        .reports-box {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .report-card {
            flex: 1;
            min-width: 200px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--glass-border);
            padding: 15px;
            border-radius: 12px;
            text-align: center;
        }

        .report-card h4 {
            margin: 0 0 8px 0;
            color: #94a3b8;
            font-size: 14px;
        }

        .report-card p {
            font-size: 22px;
            font-weight: bold;
            color: var(--accent-color);
            margin: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            border: 1px solid var(--glass-border);
            padding: 10px;
            text-align: center;
        }

        th {
            background: rgba(56, 189, 248, 0.15);
            color: var(--accent-color);
        }

        td {
            background: rgba(255, 255, 255, 0.02);
        }

        .lang-select {
            width: 140px;
            padding: 6px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- شريط علوي للتحكم باللغة والعنوان -->
    <div class="top-bar">
        <h2 id="main-heading">نظام ركاز المحاسبي المتكامل</h2>
        <div>
            <label for="langSwitch" id="lang-label" style="font-size: 14px; margin-left: 5px;">اللغة:</label>
            <select id="langSwitch" class="lang-select" onchange="changeLanguage(this.value)">
                <option value="ar" selected>العربية (Arabic)</option>
                <option value="en">English (الإنجليزية)</option>
            </select>
        </div>
    </div>

    <!-- الهوية المركزية البصرية (تعكس التصميم الاحترافي العالمي) -->
    <div class="brand-hero">
        <!-- استخدام الأيقونة الفاخرة للبرنامج -->
        <div style="font-size: 45px; margin-bottom: 5px;">🛡️🔑</div>
        <div class="brand-title">RKAZ FINANCIAL SYSTEM</div>
        <div class="brand-subtitle" id="brand-sub">نظام ركاز العالمي لإدارة نقاط البيع والمحاسبة</div>
    </div>

    <!-- صندوق التقارير المالية -->
    <div class="section">
        <h3 id="reports-title" style="margin-bottom: 10px;">التقارير المالية المختصرة</h3>
        <div class="reports-box">
            <div class="report-card">
                <h4 id="rep-sales">إجمالي المبيعات</h4>
                <p id="totalSalesVal">0.00</p>
            </div>
            <div class="report-card">
                <h4 id="rep-profits">إجمالي الأرباح</h4>
                <p id="totalProfitsVal">0.00</p>
            </div>
            <div class="report-card">
                <h4 id="rep-invoices">عدد الفواتير</h4>
                <p id="totalInvoicesVal">0</p>
            </div>
        </div>
    </div>

    <!-- قسم إضافة منتج جديد -->
    <div class="section">
        <h3 id="add-prod-title">إضافة منتج جديد للمخزون</h3>
        <input type="text" id="prodName" placeholder="اسم المنتج">
        <input type="text" id="prodBarcode" placeholder="الباركود">
        <input type="number" id="prodPrice" placeholder="سعر البيع">
        <input type="number" id="prodCost" placeholder="سعر الشراء (التكلفة)">
        <input type="number" id="prodStock" placeholder="الكمية الأولية في المخزون">
        <button id="save-btn" onclick="addProduct()">حفظ المنتج</button>
    </div>

    <!-- قسم عرض المنتجات والمخزون -->
    <div class="section">
        <h3 id="table-title">قائمة المنتجات والمخزون الحالي</h3>
        <table>
            <thead>
                <tr>
                    <th id="th-name">المنتج</th>
                    <th id="th-price">سعر البيع</th>
                    <th id="th-cost">التكلفة</th>
                    <th id="th-stock">المخزون</th>
                    <th id="th-action">إجراء</th>
                </tr>
            </thead>
            <tbody id="productsTable">
                <!-- سيتم تعبئتها تلقائياً -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const translations = {
        ar: {
            pageTitle: "نظام ركاز الشامل - نقاط البيع والمحاسبة",
            mainHeading: "نظام ركاز المحاسبي المتكامل",
            langLabel: "اللغة:",
            brandSub: "نظام ركاز العالمي لإدارة نقاط البيع والمحاسبة",
            reportsTitle: "التقارير المالية المختصرة",
            repSales: "إجمالي المبيعات",
            repProfits: "إجمالي الأرباح",
            repInvoices: "عدد الفواتير",
            addProdTitle: "إضافة منتج جديد للمخزون",
            prodName: "اسم المنتج",
            prodBarcode: "الباركود",
            prodPrice: "سعر البيع",
            prodCost: "سعر الشراء (التكلفة)",
            prodStock: "الكمية الأولية في المخزون",
            saveBtn: "حفظ المنتج",
            tableTitle: "قائمة المنتجات والمخزون الحالي",
            thName: "المنتج",
            thPrice: "سعر البيع",
            thCost: "التكلفة",
            thStock: "المخزون",
            thAction: "إجراء",
            saleBtn: "بيع (1)",
            successAdd: "تمت إضافة المنتج بنجاح",
            errorMsg: "الرجاء إدخال اسم المنتج وسعر البيع والتكلفة"
        },
        en: {
            pageTitle: "Rkaz Comprehensive System - POS & Accounting",
            mainHeading: "Rkaz Integrated Accounting System",
            langLabel: "Language:",
            brandSub: "Rkaz Global POS & Accounting Management System",
            reportsTitle: "Financial Reports Summary",
            repSales: "Total Sales",
            repProfits: "Total Profits",
            repInvoices: "Total Invoices",
            addProdTitle: "Add New Product to Inventory",
            prodName: "Product Name",
            prodBarcode: "Barcode",
            prodPrice: "Selling Price",
            prodCost: "Cost Price",
            prodStock: "Initial Stock Quantity",
            saveBtn: "Save Product",
            tableTitle: "Product List & Current Inventory",
            thName: "Product",
            thPrice: "Price",
            thCost: "Cost",
            thStock: "Stock",
            thAction: "Action",
            saleBtn: "Sell (1)",
            successAdd: "Product added successfully",
            errorMsg: "Please enter product name, price, and cost"
        }
    };

    let currentLang = 'ar';

    function changeLanguage(lang) {
        currentLang = lang;
        const t = translations[lang];

        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

        document.getElementById('page-title').innerText = t.pageTitle;
        document.getElementById('main-heading').innerText = t.mainHeading;
        document.getElementById('lang-label').innerText = t.langLabel;
        document.getElementById('brand-sub').innerText = t.brandSub;
        document.getElementById('reports-title').innerText = t.reportsTitle;
        document.getElementById('rep-sales').innerText = t.repSales;
        document.getElementById('rep-profits').innerText = t.repProfits;
        document.getElementById('rep-invoices').innerText = t.repInvoices;
        document.getElementById('add-prod-title').innerText = t.addProdTitle;
        document.getElementById('prodName').placeholder = t.prodName;
        document.getElementById('prodBarcode').placeholder = t.prodBarcode;
        document.getElementById('prodPrice').placeholder = t.prodPrice;
        document.getElementById('prodCost').placeholder = t.prodCost;
        document.getElementById('prodStock').placeholder = t.prodStock;
        document.getElementById('save-btn').innerText = t.saveBtn;
        document.getElementById('table-title').innerText = t.tableTitle;
        document.getElementById('th-name').innerText = t.thName;
        document.getElementById('th-price').innerText = t.thPrice;
        document.getElementById('th-cost').innerText = t.thCost;
        document.getElementById('th-stock').innerText = t.thStock;
        document.getElementById('th-action').innerText = t.thAction;

        loadData();
    }

    async function loadData() {
        const resProd = await fetch('/api/products');
        const products = await resProd.json();
        const tbody = document.getElementById('productsTable');
        tbody.innerHTML = '';
        
        const t = translations[currentLang];

        products.forEach(p => {
            tbody.innerHTML += `
                <tr>
                    <td>${p.name}</td>
                    <td>${p.price}</td>
                    <td>${p.cost}</td>
                    <td>${p.stock}</td>
                    <td><button style="background:#0284c7; width:auto; padding:6px 12px; margin:0;" onclick="quickSale(${p.id}, ${p.price}, ${p.cost})">${t.saleBtn}</button></td>
                </tr>
            `;
        });

        const resRep = await fetch('/api/reports');
        const report = await resRep.json();
        document.getElementById('totalSalesVal').innerText = (report.total_sales || 0) + ' ر.س';
        document.getElementById('totalProfitsVal').innerText = (report.total_profits || 0) + ' ر.س';
        document.getElementById('totalInvoicesVal').innerText = (report.total_invoices || 0);
    }

    async function addProduct() {
        const t = translations[currentLang];
        const name = document.getElementById('prodName').value;
        const barcode = document.getElementById('prodBarcode').value;
        const price = parseFloat(document.getElementById('prodPrice').value);
        const cost = parseFloat(document.getElementById('prodCost').value);
        const stock = parseInt(document.getElementById('prodStock').value);

        if(!name || isNaN(price) || isNaN(cost)) {
            alert(t.errorMsg);
            return;
        }

        const res = await fetch('/api/products', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ name, barcode, price, cost, stock })
        });

        const data = await res.json();
        alert(data.message ? t.successAdd : 'تمت العملية');
        loadData();
    }

    async function quickSale(productId, price, cost) {
        const profit = price - cost;
        const res = await fetch('/api/sales', {
            path: '/api/sales',
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                total_amount: price,
                total_profit: profit,
                items: [{ product_id: productId, quantity: 1, price: price, cost: cost }]
            })
        });

        const data = await res.json();
        alert(data.message);
        loadData();
    }

    loadData();
</script>

</body>
</html>
